name: Build Xurripoints APK

# Compila el APK en la nube (gratis; release firmado con la clave estable) y lo publica en Releases.
# Se dispara al hacer push a main o manualmente (Run workflow).
on:
  push:
    branches: [ main ]
    paths-ignore:            # un push solo de docs/CHANGELOG no recompila el APK
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Igual que en DopaQuest: usamos el SDK que ya trae ubuntu-latest (más estable que setup-android).
      - name: Instalar componentes del SDK (API 36 — lo que pide Capacitor 8)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Instalar dependencias
        run: npm ci --ignore-scripts   # sharp (solo para generar iconos en local) no hace falta aquí

      - name: Pruebas de la lógica
        run: node tests/logic.test.mjs

      - name: Empaquetar Firebase y sincronizar Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Clave de firma estable (desde los secretos del repo)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android/app/xurripoints.p12; echo "Firma estable: OK"; else echo "::warning::Sin ANDROID_KEYSTORE_B64 → firma de depuración aleatoria (habrá que desinstalar para actualizar)"; fi

      - name: Versión (de la cabecera del CHANGELOG)
        id: ver
        run: |
          VERSION=$(grep -m1 -oE '\[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '[]')
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Si la versión ya está publicada, un push la PISARÍA (pasó con la v0.6.0, que salió como v0.5.0).
      - name: ¿Es una versión nueva?
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::La versión ${{ steps.ver.outputs.version }} ya está publicada. Súbela en CHANGELOG.md, package.json y app/app.js."
            exit 1
          fi

      # Release firmado con la clave estable (se instala encima de las versiones anteriores).
      # Si faltan los secretos de la clave, se hace uno de depuración para no romper el build.
      - name: Compilar APK
        id: apk
        env:
          XP_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -f app/xurripoints.p12 ] && [ -n "$XP_KEYSTORE_PASS" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin clave de firma → APK de depuración"
            ./gradlew assembleDebug --no-daemon --stacktrace
            echo "path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Renombrar APK con la versión (+ copia con nombre fijo para el enlace permanente)
        run: |
          cp "${{ steps.apk.outputs.path }}" "Xurripoints-v${{ steps.ver.outputs.version }}.apk"
          cp "${{ steps.apk.outputs.path }}" "Xurripoints.apk"

      - name: Publicar en Releases (la última siempre en /releases/latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Xurripoints v${{ steps.ver.outputs.version }}
          body: |
            Última versión de Xurripoints para Android.
            **Descarga:** `Xurripoints.apk` (abajo, en Assets).
            Enlace permanente (siempre la última): https://github.com/${{ github.repository }}/releases/latest/download/Xurripoints.apk
          files: |
            Xurripoints-v${{ steps.ver.outputs.version }}.apk
            Xurripoints.apk
          make_latest: true

      - name: Subir APK (copia como artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xurripoints-apk
          path: Xurripoints-v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

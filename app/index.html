<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Seguridad (v0.15.1): solo scripts y estilos propios; red solo a Firebase y a GitHub (aviso de versión nueva).
       style-src-attr 'unsafe-inline' porque la app pinta style="--i:…; width:…%" (no deja meter <style>).
       El puente de Capacitor entra antes de esta línea (justo tras <head>) o como script del WebView: no le afecta.
       Si algún día se activa App Check o reCAPTCHA en Firebase, hay que añadir sus dominios aquí. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="theme-color" content="#FFF3EC" />
  <meta name="color-scheme" content="light" />
  <title>Xurripoints</title>
  <link rel="icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Cuando haya Firebase configurado, esto ahorra una ida y vuelta antes del primer dato. -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
  <!-- Las dos fuentes que sí se usan (el subconjunto latino): sin esto, el título cambia de letra al cargar. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/6NU78FyLNQOQZAnv9bYEvDiIdE9Ea92usiIk_WBq8U_9v0c2WS01xC9TeA.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/wlpwgwvFAVdoq2_v-6QU.woff2" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="sheet-root"></div>
  <div id="dialog-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="native.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
